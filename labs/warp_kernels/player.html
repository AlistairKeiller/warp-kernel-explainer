<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Warp moves the cars</title>
<style>
  html, body { margin: 0; height: 100%; background: #0B0B10; color: #B4B4C0; font: 15px/1.4 Arial, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; cursor: pointer; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #0B0B10; }
  video.back { visibility: hidden; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end;
         padding: 10px 18px; pointer-events: none; opacity: 0; transition: opacity .3s; }
  body.awake #hud { opacity: 1; }
  #bar { position: fixed; left: 0; bottom: 0; height: 3px; background: #58C4DD; width: 0; transition: width .25s; }
  #help { position: fixed; top: 14px; right: 18px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  body.awake #help { opacity: .7; }
  kbd { border: 1px solid #797985; border-radius: 3px; padding: 0 5px; font: inherit; }
</style>
</head>
<body>
<div id="stage">
  <video id="a" muted playsinline preload="auto"></video>
  <video id="b" class="back" muted playsinline preload="auto"></video>
</div>
<div id="help">click or <kbd>→</kbd> next · <kbd>←</kbd> back · <kbd>f</kbd> fullscreen</div>
<div id="hud"><span id="chapter"></span><span id="counter"></span></div>
<div id="bar"></div>
<script>
const slides = __SLIDES__;
const videos = [document.getElementById("a"), document.getElementById("b")];
let front = 0;
let index = -1;
let busy = false;

const current = () => videos[front];
const spare = () => videos[1 - front];

function loaded(video, src) {
  return new Promise(resolve => {
    if (video.dataset.src === src && video.readyState >= 2) return resolve();
    video.dataset.src = src;
    video.src = src;
    video.addEventListener("loadeddata", resolve, { once: true });
    video.load();
  });
}

function seekEnd(video) {
  return new Promise(resolve => {
    video.pause();
    video.addEventListener("seeked", resolve, { once: true });
    video.currentTime = Math.max(0, video.duration - 0.04);
  });
}

function swap() {
  spare().classList.remove("back");
  current().classList.add("back");
  current().pause();
  front = 1 - front;
}

function hud() {
  document.getElementById("chapter").textContent = slides[index].chapter;
  document.getElementById("counter").textContent = `${index + 1} / ${slides.length}`;
  document.getElementById("bar").style.width = `${100 * (index + 1) / slides.length}%`;
  wake();
}

function preload(k) {
  if (k >= 0 && k < slides.length) loaded(spare(), slides[k].src);
}

async function show(k, { atEnd = false } = {}) {
  if (busy || k < 0 || k >= slides.length) return;
  busy = true;
  index = k;
  await loaded(spare(), slides[k].src);
  if (atEnd) await seekEnd(spare()); else spare().currentTime = 0;
  swap();
  if (!atEnd) current().play();
  hud();
  busy = false;
  preload(k + 1);
}

function next() {
  const video = current();
  if (index >= 0 && !video.ended && !video.paused) {
    seekEnd(video);  // a click during an animation finishes it; the next click advances
    return;
  }
  show(index + 1);
}

function back() {
  show(index - 1, { atEnd: true });
}

let timer;
function wake() {
  document.body.classList.add("awake");
  clearTimeout(timer);
  timer = setTimeout(() => document.body.classList.remove("awake"), 2500);
}

document.getElementById("stage").addEventListener("click", next);
document.addEventListener("mousemove", wake);
document.addEventListener("keydown", event => {
  const keys = {
    ArrowRight: next, " ": next, Enter: next, PageDown: next,
    ArrowLeft: back, Backspace: back, PageUp: back,
    Home: () => show(0), End: () => show(slides.length - 1, { atEnd: true }),
    f: () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(),
  };
  if (keys[event.key]) { event.preventDefault(); keys[event.key](); }
});

show(0);
</script>
</body>
</html>
